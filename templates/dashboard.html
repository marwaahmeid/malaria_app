<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial;
            background:#0b1220;
            color:white;
            margin:0;
        }

        .topbar {
            display:flex;
            justify-content:space-between;
            padding:20px;
            background:#111827;
        }

        .cards {
            display:flex;
            justify-content:center;
            gap:20px;
            margin-top:30px;
        }

        .card {
            background:#111827;
            padding:20px;
            border-radius:12px;
            width:180px;
            text-align:center;
        }

        canvas {
            max-width:400px;
            margin:30px auto;
            display:block;
        }

        .history {
            text-align:center;
        }

        .item {
            background:#111827;
            margin:10px auto;
            padding:10px;
            width:60%;
            border-radius:10px;
        }

        a {
            color:white;
            text-decoration:none;
        }
    </style>
</head>

<body>

<div class="topbar">
    <h3>📊 Admin Dashboard</h3>
    <a href="/logout">🚪 Logout</a>
</div>

<div class="cards">

    <div class="card">
        <h2>{{ stats.total }}</h2>
        <p>Total</p>
    </div>

    <div class="card">
        <h2>{{ stats.parasitized }}</h2>
        <p>Parasitized</p>
    </div>

    <div class="card">
        <h2>{{ stats.uninfected }}</h2>
        <p>Uninfected</p>
    </div>

</div>

<canvas id="chart"></canvas>

<script>
new Chart(document.getElementById("chart"), {
    type: "doughnut",
    data: {
        labels: ["Parasitized", "Uninfected"],
        datasets: [{
            data: [
                {{ stats.parasitized }},
                {{ stats.uninfected }}
            ]
        }]
    }
});
</script>

<div class="history">

    <h2>Recent Predictions</h2>

    {% for item in stats.history %}
        <div class="item">
            <p>{{ item.time }}</p>
            <strong>{{ item.result }}</strong><br>
            <img src="/{{ item.image }}" width="120">
        </div>
    {% endfor %}

</div>

</body>
</html>
