<!DOCTYPE html>
<html>
<head>
    <title>Malaria Prediction</title>

    <style>
        body{
            margin:0;
            font-family:Arial;
            background:#0f172a;
            color:white;
            text-align:center;
        }

        .card{
            width:400px;
            margin:auto;
            margin-top:60px;
            background:#111827;
            padding:30px;
            border-radius:15px;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:10px;
        }

        button{
            width:100%;
            padding:10px;
            margin-top:10px;
            border:none;
            border-radius:8px;
            cursor:pointer;
        }

        .predict{background:#22c55e;color:white;}
        .dash{background:#3b82f6;color:white;}

        img{
            margin-top:20px;
            border-radius:10px;
        }
    </style>
</head>

<body>

<div class="card">

    <h2>🧬 Malaria Prediction</h2>

    <form action="/predict" method="POST" enctype="multipart/form-data">
        <input type="file" name="image" required>
        <button class="predict">Predict</button>
    </form>

    <a href="/dashboard">
        <button class="dash">Dashboard</button>
    </a>

    <a href="/logout">
        <button style="background:red;color:white;margin-top:10px;">Logout</button>
    </a>

    {% if prediction %}
        <h3>{{ prediction }}</h3>
        <img src="{{ image_path }}" width="250">
    {% endif %}

</div>

</body>
</html>
